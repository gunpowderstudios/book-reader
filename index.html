<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chapter & Verse — EPUB Reader</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#12201b;color:#ecf5ec;font:16px system-ui}header,footer{background:#1b3227;padding:16px;border-color:#476450}header{display:flex;align-items:center;justify-content:space-between}main{max-width:1150px;margin:20px auto;display:grid;grid-template-columns:240px 1fr;gap:18px;padding:0 16px 180px}aside,article{background:#1c2c25;padding:22px;border-radius:16px;border:1px solid #415a49}button,select,.upload{background:#325740;color:white;border:1px solid #698570;border-radius:8px;padding:9px 13px;font:inherit;cursor:pointer}button:hover,.upload:hover{background:#467655}button:disabled{opacity:.5}#chapters button{display:block;width:100%;text-align:left;margin:5px 0}#chapters{max-height:60vh;overflow:auto}#text{font:21px/1.85 Georgia,serif}#text p{padding:8px;border-radius:6px;cursor:pointer}#text p.current{background:#385845}footer{position:fixed;bottom:0;left:0;right:0;border-top:1px solid #476450}footer>div{display:flex;align-items:center;justify-content:space-around;flex-wrap:wrap;gap:8px}#seek{width:min(360px,50vw)}input[type=range]{accent-color:#87dbaa}#play{background:#9de0b7;color:#14231a;font-weight:bold}small{color:#c1d7c6}@media(max-width:720px){main{display:block;padding-bottom:240px}aside{margin-bottom:12px}#chapters{max-height:120px}#text{font-size:18px}}
</style><header><strong>◖◗ CHAPTER & VERSE <small>v1.0</small></strong><label class="upload" for="file">＋ Open EPUB</label><input hidden id="file" type="file" accept=".epub,application/epub+zip"></header><main><aside><h2 id="title">Your Library</h2><p id="author">Choose an EPUB to begin.</p><h3>Chapters</h3><div id="chapters"></div></aside><article><h1 id="heading">Let the story unfold.</h1><p id="intro">Open any DRM-free EPUB and listen using your browser's speech voices. Your book stays on your own device.</p><div id="text"></div></article></main><footer><div><div><strong id="now">Nothing playing</strong><br><small id="status">Open an EPUB to start</small></div><div><button id="previous" title="Previous chapter">⏮</button><button id="back" title="Previous paragraph">↶</button><button id="play">▶ Play</button><button id="forward" title="Next paragraph">↷</button><button id="next" title="Next chapter">⏭</button></div><div><select id="voice" aria-label="Voice"></select> <label>Speed <span id="speed">1.0×</span> <input id="rate" type="range" min=".6" max="1.8" step=".1" value="1"></label><button id="small">A−</button><button id="large">A+</button></div></div><div style="justify-content:center;margin-top:10px"><span id="pct">0%</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="num">0 / 0</span></div></footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),s=window.speechSynthesis,S={chapters:[],index:0,p:0,playing:false,paused:false,token:0,key:'',voices:[],font:21};const norm=x=>(x||'').replace(/\s+/g,' ').trim(),xml=t=>new DOMParser().parseFromString(t,'application/xml'),elements=(n,t)=>Array.from(n?.getElementsByTagName('*')||[]).filter(e=>e.localName===t),one=(n,t)=>elements(n,t)[0],a=(n,k)=>n?.getAttribute(k)||'',dir=s=>s.includes('/')?s.slice(0,s.lastIndexOf('/')):'',join=(base,href)=>{let ps=base.split('/').filter(Boolean);for(let p of decodeURIComponent(href.split('#')[0]).split('/')){if(p==='..')ps.pop();else if(p&&p!=='.')ps.push(p)}return ps.join('/')};
function save(){if(S.key)localStorage.setItem('cv-'+S.key,JSON.stringify({index:S.index,p:S.p}))}function stop(){window.chapterKokoro?.stop();S.token++;S.playing=false;S.paused=false;s?.cancel();$('play').textContent='▶ Play'}function highlight(){let c=S.chapters[S.index],n=c?.paragraphs.length||0;$('pct').textContent=n?Math.round(S.p/n*100)+'%':'0%';$('num').textContent=n?S.p+1+' / '+n:'0 / 0';$('seek').value=n?Math.round(S.p/n*1000):0;document.querySelectorAll('#text .current').forEach(x=>x.classList.remove('current'));let el=$('text').querySelector('[data-p="'+S.p+'"]');if(el){el.classList.add('current');if(S.playing)el.scrollIntoView({block:'nearest',behavior:'smooth'})}save()}function render(){let c=S.chapters[S.index];if(!c)return;$('heading').textContent=c.title;$('now').textContent=c.title;$('text').replaceChildren();c.paragraphs.forEach((text,i)=>{let p=document.createElement('p');p.dataset.p=i;p.textContent=text;p.onclick=()=>{stop();S.p=i;highlight()};$('text').append(p)});$('chapters').replaceChildren();S.chapters.forEach((ch,i)=>{let b=document.createElement('button');b.textContent=ch.title;if(i===S.index)b.style.background='#579575';b.onclick=()=>moveChapter(i);$('chapters').append(b)});highlight()}function moveChapter(i,auto=false){if(i<0||i>=S.chapters.length)return;stop();S.index=i;S.p=0;render();if(auto)play()}
function split(s){let arr=s.match(/[^.!?]+[.!?]*|[^.!?]+$/g)||[s],out=[],buf='';for(let x of arr){if(buf.length+x.length>190&&buf){out.push(buf);buf=''}while(x.length>190){out.push(x.slice(0,190));x=x.slice(190)}buf+=x}if(buf)out.push(buf);return out}
function play(){if(!S.chapters.length){$('status').textContent='Choose an EPUB first';return}if(S.paused){S.paused=false;S.playing=true;s.resume();$('play').textContent='Ⅱ Pause';return}stop();S.playing=true;$('play').textContent='Ⅱ Pause';$('status').textContent='Reading aloud';const token=S.token;let parts=[],part=0;function say(){if(token!==S.token||!S.playing)return;let c=S.chapters[S.index];if(S.p>=c.paragraphs.length){if(S.index+1===S.chapters.length){stop();$('status').textContent='Finished book';return}S.index++;S.p=0;render();c=S.chapters[S.index]}if(!parts.length)parts=split(c.paragraphs[S.p]);let u=new SpeechSynthesisUtterance(parts[part]);u.rate=+$('rate').value;let v=S.voices.find(v=>v.voiceURI===$('voice').value);if(v){u.voice=v;u.lang=v.lang}else u.lang='en-GB';u.onend=()=>{if(token!==S.token)return;part++;if(part===parts.length){parts=[];part=0;S.p++;highlight()}say()};u.onerror=e=>{if(token!==S.token||e.error==='canceled'||e.error==='interrupted')return;stop();$('status').textContent='Speech error: '+e.error};s.speak(u);highlight()}say()}
$('play').onclick=()=>{if($('voice').value==='kokoro-george'){if(!window.chapterKokoro){$('status').textContent='George is still loading. Refresh the page.';return}window.chapterKokoro.toggle({S,update:highlight,render});return}if(S.playing){S.playing=false;S.paused=true;s.pause();$('play').textContent='▶ Resume';$('status').textContent='Paused'}else play()};$('previous').onclick=()=>moveChapter(S.index-1);$('next').onclick=()=>moveChapter(S.index+1);$('back').onclick=()=>{stop();S.p=Math.max(0,S.p-1);highlight()};$('forward').onclick=()=>{stop();S.p=Math.min((S.chapters[S.index]?.paragraphs.length||1)-1,S.p+1);highlight()};$('seek').onchange=()=>{if(!S.chapters.length)return;stop();S.p=Math.min(S.chapters[S.index].paragraphs.length-1,Math.floor(+$('seek').value/1000*S.chapters[S.index].paragraphs.length));highlight()};$('rate').oninput=()=>{$('speed').textContent=(+$('rate').value).toFixed(1)+'×';localStorage.setItem('cv-rate',$('rate').value)};$('rate').value=localStorage.getItem('cv-rate')||1;$('rate').oninput();$('small').onclick=()=>{$('text').style.fontSize=(S.font=Math.max(14,S.font-2))+'px'};$('large').onclick=()=>{$('text').style.fontSize=(S.font=Math.min(32,S.font+2))+'px'};
function voices(){S.voices=s?.getVoices()||[];let selected=$('voice').value||localStorage.getItem('cv-voice')||'kokoro-george';$('voice').replaceChildren();S.voices.sort((a,b)=>(b.lang==='en-GB')-(a.lang==='en-GB'));S.voices.forEach(v=>$('voice').add(new Option(v.name+' ('+v.lang+')',v.voiceURI)));$('voice').add(new Option('★ George — Kokoro AI (British male)','kokoro-george'));if(selected==='kokoro-george'||S.voices.some(v=>v.voiceURI===selected))$('voice').value=selected;else{let v=S.voices.find(v=>v.lang==='en-GB')||S.voices.find(v=>v.lang.startsWith('en'));if(v)$('voice').value=v.voiceURI}}voices();if(s)s.onvoiceschanged=voices;$('voice').onchange=()=>{stop();localStorage.setItem('cv-voice',$('voice').value)};
$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;stop();$('status').textContent='Opening EPUB...';try{if(!window.JSZip)throw Error('EPUB support library unavailable. Check internet connection.');let zip=await JSZip.loadAsync(file),f=zip.file('META-INF/container.xml');if(!f)throw Error('Invalid EPUB');let root=xml(await f.async('string')),opfPath=a(one(root,'rootfile'),'full-path'),opf=xml(await zip.file(opfPath).async('string')),manifest=new Map;elements(one(opf,'manifest'),'item').forEach(x=>manifest.set(a(x,'id'),{href:a(x,'href'),type:a(x,'media-type')}));let chapters=[];for(let ref of elements(one(opf,'spine'),'itemref')){let m=manifest.get(a(ref,'idref'));if(!m||!/html/.test(m.type))continue;let entry=zip.file(join(dir(opfPath),m.href));if(!entry)continue;let doc=new DOMParser().parseFromString(await entry.async('string'),'text/html');doc.querySelectorAll('script,style,nav,footer,header,aside,svg').forEach(n=>n.remove());let blocks=Array.from(doc.body.querySelectorAll('h1,h2,h3,h4,h5,h6,p,li,blockquote')).filter(n=>!n.parentElement.closest('p,li,blockquote'));let paragraphs=blocks.map(x=>norm(x.textContent)).filter(Boolean);if(!paragraphs.length){let t=norm(doc.body.textContent);if(t)paragraphs=[t]}if(paragraphs.length)chapters.push({title:paragraphs[0].length<95?paragraphs[0]:'Section '+(chapters.length+1),paragraphs})}if(!chapters.length)throw Error('No readable chapters found; DRM books unsupported');S.chapters=chapters;let meta=one(opf,'metadata');$('title').textContent=norm(one(meta,'title')?.textContent)||file.name;$('author').textContent=norm(one(meta,'creator')?.textContent)||'Unknown author';S.key=[file.name,file.size,file.lastModified].join('-');let saved=JSON.parse(localStorage.getItem('cv-'+S.key)||'{}');S.index=Math.max(0,Math.min(chapters.length-1,saved.index||0));S.p=Math.max(0,Math.min(chapters[S.index].paragraphs.length-1,saved.p||0));$('intro').remove();render();$('status').textContent='Ready. Press Play.'}catch(err){$('status').textContent='Unable to open EPUB: '+err.message}};window.addEventListener('beforeunload',save);
})();
</script><script defer src="kokoro.js"></script></html>
